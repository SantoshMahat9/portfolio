<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#E50914" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- The Professor's Iconic Origami Crane (Geometric Folding Facets) -->
  <polygon points="60,10 75,55 60,70 45,55" fill="#E50914" fill-opacity="0.12" />
  <polygon points="60,10 95,35 75,55" fill="#E50914" fill-opacity="0.18" />
  <polygon points="60,10 25,35 45,55" fill="#E50914" fill-opacity="0.08" />
  <polygon points="75,55 110,65 60,70" fill="#E50914" fill-opacity="0.15" />
  <polygon points="45,55 10,65 60,70" fill="#E50914" fill-opacity="0.06" />
  <polygon points="60,70 70,110 60,95" fill="#E50914" fill-opacity="0.2" />
  <polygon points="60,70 50,110 60,95" fill="#E50914" fill-opacity="0.1" />
  <!-- Fold creases -->
  <line x1="60" y1="10" x2="60" y2="95" stroke="#E50914" stroke-dasharray="2 2" stroke-opacity="0.7" />
  <line x1="45" y1="55" x2="75" y2="55" stroke="#E50914" stroke-opacity="0.5" />
</svg>
