<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC247"/>
      <stop offset="100%" stop-color="#FF4D1C"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad3)"/>

  <!-- Glowing atmospheric circle -->
  <circle cx="600" cy="400" r="280" fill="#FFC247" opacity="0.08" filter="url(#glow3)"/>
  <circle cx="450" cy="300" r="160" fill="#FF4D1C" opacity="0.06" filter="url(#glow3)"/>

  <!-- Code Workbench Container -->
  <rect x="200" y="150" width="800" height="490" rx="24" fill="#18181C" stroke="#FFC247" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Window Bar -->
  <rect x="200" y="150" width="800" height="60" rx="24" fill="#202026"/>
  <circle cx="240" cy="180" r="6" fill="#FF4D1C"/>
  <circle cx="260" cy="180" r="6" fill="#FFC247"/>
  <circle cx="280" cy="180" r="6" fill="#25D366"/>
  <text x="320" y="186" fill="#D6D6D6" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="1">FULL STACK EXPERIMENTAL LAB // RESTful API &amp; MONGODB</text>
  <rect x="860" y="168" width="115" height="24" rx="12" fill="#FFC247" fill-opacity="0.2"/>
  <text x="880" y="184" fill="#FFC247" font-family="monospace" font-weight="bold" font-size="11">IN PROGRESS</text>

  <!-- Left: API Route Tree -->
  <g transform="translate(230, 240)">
    <rect width="240" height="370" rx="16" fill="#121215" stroke="#2A2A33" stroke-width="1"/>
    <text x="20" y="32" fill="#FFC247" font-family="monospace" font-size="12" font-weight="bold">ROUTES &amp; CONTROLLERS</text>
    
    <g transform="translate(16, 55)">
      <rect width="52" height="22" rx="4" fill="#25D366" fill-opacity="0.2"/>
      <text x="10" y="16" fill="#25D366" font-family="monospace" font-size="11" font-weight="bold">GET</text>
      <text x="65" y="16" fill="#D6D6D6" font-family="monospace" font-size="12">/api/v1/projects</text>
    </g>

    <g transform="translate(16, 95)">
      <rect width="52" height="22" rx="4" fill="#FF4D1C" fill-opacity="0.2"/>
      <text x="8" y="16" fill="#FF4D1C" font-family="monospace" font-size="11" font-weight="bold">POST</text>
      <text x="65" y="16" fill="#D6D6D6" font-family="monospace" font-size="12">/api/v1/auth/login</text>
    </g>

    <g transform="translate(16, 135)">
      <rect width="52" height="22" rx="4" fill="#FFC247" fill-opacity="0.2"/>
      <text x="12" y="16" fill="#FFC247" font-family="monospace" font-size="11" font-weight="bold">PUT</text>
      <text x="65" y="16" fill="#D6D6D6" font-family="monospace" font-size="12">/api/v1/tasks/:id</text>
    </g>

    <g transform="translate(16, 175)">
      <rect width="52" height="22" rx="4" fill="#E93616" fill-opacity="0.2"/>
      <text x="6" y="16" fill="#E93616" font-family="monospace" font-size="11" font-weight="bold">DEL</text>
      <text x="65" y="16" fill="#D6D6D6" font-family="monospace" font-size="12">/api/v1/records</text>
    </g>

    <line x1="20" y1="230" x2="220" y2="230" stroke="#2A2A33" stroke-width="1"/>
    
    <text x="20" y="260" fill="#A3A3A3" font-family="monospace" font-size="11">DATABASE: MongoDB Cluster</text>
    <text x="20" y="284" fill="#25D366" font-family="monospace" font-size="11">● Active connection pool</text>
    <text x="20" y="308" fill="#A3A3A3" font-family="monospace" font-size="11">RUNTIME: Node.js v20+</text>
    <text x="20" y="332" fill="#FFC247" font-family="monospace" font-size="11">ARCHITECTURE: RESTful MVC</text>
  </g>

  <!-- Right: Code Editor Box -->
  <g transform="translate(490, 240)">
    <rect width="480" height="370" rx="16" fill="#0F0F12" stroke="#2A2A33" stroke-width="1"/>
    
    <g transform="translate(24, 35)">
      <text x="0" y="0" fill="#7D7D8E" font-family="monospace" font-size="12">// Modular Express Async Controller</text>
      <text x="0" y="26" fill="#FF4D1C" font-family="monospace" font-size="13">router.post('/create', async (req, res) =&gt; {</text>
      <text x="20" y="52" fill="#D6D6D6" font-family="monospace" font-size="13">const { title, payload, owner } = req.body;</text>
      <text x="20" y="78" fill="#FFC247" font-family="monospace" font-size="13">if (!title || !payload) {</text>
      <text x="40" y="104" fill="#E93616" font-family="monospace" font-size="13">return res.status(400).json({ error: 'Missing fields' });</text>
      <text x="20" y="130" fill="#FFC247" font-family="monospace" font-size="13">}</text>
      <text x="20" y="156" fill="#25D366" font-family="monospace" font-size="13">const doc = await MongoCollection.insertOne({</text>
      <text x="40" y="182" fill="#D6D6D6" font-family="monospace" font-size="13">title, payload, owner, createdAt: new Date()</text>
      <text x="20" y="208" fill="#25D366" font-family="monospace" font-size="13">});</text>
      <text x="20" y="234" fill="#D6D6D6" font-family="monospace" font-size="13">res.status(201).json({ success: true, id: doc.insertedId });</text>
      <text x="0" y="260" fill="#FF4D1C" font-family="monospace" font-size="13">});</text>

      <rect y="290" width="430" height="34" rx="8" fill="#1C1C24"/>
      <text x="14" y="312" fill="#25D366" font-family="monospace" font-size="11">✓ TEST SUITE: 14 PASSING (180ms) · ZERO VULNERABILITIES</text>
    </g>
  </g>

  <!-- Titles -->
  <text x="600" y="710" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="28" letter-spacing="1">FULL-STACK WEB &amp; API LABORATORY</text>
  <text x="600" y="740" text-anchor="middle" fill="#FFC247" font-family="monospace" font-size="14" letter-spacing="3">NODE.JS • MONGODB • REST APIS • JAVASCRIPT ES6+ • FULL STACK</text>
</svg>
