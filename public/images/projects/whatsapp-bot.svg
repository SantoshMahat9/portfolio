<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E15"/>
      <stop offset="50%" stop-color="#0E150F"/>
      <stop offset="100%" stop-color="#080C09"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D1C"/>
      <stop offset="100%" stop-color="#FFC247"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#25D366" stroke-width="0.5" stroke-opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Glowing atmospheric aura -->
  <circle cx="600" cy="400" r="280" fill="#25D366" opacity="0.08" filter="url(#glow)"/>
  <circle cx="750" cy="300" r="180" fill="#FF4D1C" opacity="0.06" filter="url(#glow)"/>

  <!-- Main Chatbot Architecture Container -->
  <rect x="220" y="160" width="760" height="480" rx="24" fill="#111812" stroke="#25D366" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Terminal / Chat header -->
  <rect x="220" y="160" width="760" height="60" rx="24" fill="#162218"/>
  <circle cx="260" cy="190" r="6" fill="#FF4D1C"/>
  <circle cx="282" cy="190" r="6" fill="#FFC247"/>
  <circle cx="304" cy="190" r="6" fill="#25D366"/>
  <text x="350" y="196" fill="#A3A3A3" font-family="monospace" font-size="14" letter-spacing="2">WHATSAPP BUSINESS API // WEBHOOK GATEWAY : 8080</text>
  <rect x="850" y="178" width="105" height="24" rx="12" fill="#25D366" fill-opacity="0.2"/>
  <text x="874" y="194" fill="#25D366" font-family="sans-serif" font-weight="bold" font-size="11">ONLINE 200</text>

  <!-- Incoming Message Bubble (Client) -->
  <g transform="translate(260, 260)">
    <rect width="380" height="64" rx="16" fill="#1C281F" stroke="#25D366" stroke-width="1" stroke-opacity="0.2"/>
    <text x="24" y="32" fill="#E6E6E6" font-family="sans-serif" font-size="15" font-weight="500">POST /webhook: "Request Portfolio &amp; Details"</text>
    <text x="24" y="50" fill="#718B77" font-family="monospace" font-size="11">13:07:42 · SHA256 verified</text>
  </g>

  <!-- Python Processing Core -->
  <g transform="translate(680, 260)">
    <circle cx="60" cy="32" r="32" fill="#182A20" stroke="#FFC247" stroke-width="1.5"/>
    <path d="M48 24 L72 32 L48 40 Z" fill="#FFC247"/>
    <text x="110" y="36" fill="#FFC247" font-family="monospace" font-size="13" font-weight="bold">PYTHON INTENT ROUTER</text>
  </g>

  <!-- Outgoing Message Bubble (Bot) -->
  <g transform="translate(360, 360)">
    <rect width="580" height="90" rx="18" fill="url(#greenGlow)" fill-opacity="0.18" stroke="#25D366" stroke-width="1.5"/>
    <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">✓ Santosh Mahato — Full Stack Developer</text>
    <text x="24" y="58" fill="#D6D6D6" font-family="sans-serif" font-size="13">Automated dispatch via Meta Cloud API. Query resolved in 24ms.</text>
    <text x="24" y="76" fill="#25D366" font-family="monospace" font-size="11">STATUS: HTTP 200 OK · PAYLOAD: JSON_RESPONSE</text>
  </g>

  <!-- Code / Payload Stream Snippet -->
  <g transform="translate(260, 480)">
    <rect width="680" height="120" rx="14" fill="#0A0E0B" stroke="#223325" stroke-width="1"/>
    <text x="24" y="32" fill="#FF4D1C" font-family="monospace" font-size="12">import</text>
    <text x="75" y="32" fill="#D6D6D6" font-family="monospace" font-size="12">requests, json, os</text>
    <text x="24" y="54" fill="#25D366" font-family="monospace" font-size="12">def dispatch_response(sender_id, template):</text>
    <text x="48" y="76" fill="#A3A3A3" font-family="monospace" font-size="12">headers = {"Authorization": f"Bearer {META_TOKEN}", "Content-Type": "application/json"}</text>
    <text x="48" y="98" fill="#FFC247" font-family="monospace" font-size="12">return requests.post(WHATSAPP_API_URL, json=payload, headers=headers)</text>
  </g>
  
  <!-- Badges at bottom -->
  <text x="600" y="710" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="28" letter-spacing="1">WHATSAPP CHATBOT AUTOMATION</text>
  <text x="600" y="740" text-anchor="middle" fill="#25D366" font-family="monospace" font-size="14" letter-spacing="3">PYTHON • META GRAPH API • REST ENDPOINTS • WEBHOOKS</text>
</svg>
