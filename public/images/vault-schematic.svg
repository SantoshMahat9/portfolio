<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#E50914" stroke-width="1.2">
  <!-- Central Vault Dial -->
  <circle cx="100" cy="100" r="85" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <circle cx="100" cy="100" r="65" stroke-opacity="0.5" />
  <circle cx="100" cy="100" r="45" stroke-dasharray="6 3" stroke-opacity="0.4" />
  <circle cx="100" cy="100" r="22" stroke-opacity="0.7" fill="#E50914" fill-opacity="0.08" />
  
  <!-- Dial Notches -->
  <line x1="100" y1="10" x2="100" y2="25" stroke-opacity="0.8" />
  <line x1="100" y1="175" x2="100" y2="190" stroke-opacity="0.8" />
  <line x1="10" y1="100" x2="25" y2="100" stroke-opacity="0.8" />
  <line x1="175" y1="100" x2="190" y2="100" stroke-opacity="0.8" />
  
  <!-- Diagonal Locking Bolts -->
  <line x1="36" y1="36" x2="50" y2="50" stroke-opacity="0.5" />
  <line x1="164" y1="164" x2="150" y2="150" stroke-opacity="0.5" />
  <line x1="164" y1="36" x2="150" y2="50" stroke-opacity="0.5" />
  <line x1="36" y1="164" x2="50" y2="150" stroke-opacity="0.5" />
  
  <!-- Laser Crosshairs -->
  <line x1="90" y1="100" x2="110" y2="100" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" />
  <line x1="100" y1="90" x2="100" y2="110" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" />
</svg>
